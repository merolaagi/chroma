[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chroma-arch"
version = "0.1.0"
description = "Reference-frame JEPA modules under a gene-regulatory slow state"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Manish Bhattarai" }]
keywords = ["jepa", "equivariance", "world-models", "sensorimotor",
            "thousand-brains", "gene-regulatory-network", "continual-learning"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["torch>=2.1"]

[project.urls]
Homepage = "https://github.com/merolaagi/chroma-arch"
Issues = "https://github.com/merolaagi/chroma-arch/issues"

[tool.setuptools.packages.find]
include = ["chroma*"]
