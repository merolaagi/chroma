<svg xmlns="http://www.w3.org/2000/svg" width="680" height="310" viewBox="0 0 680 310"><title>How often each loop fires during one grasp</title><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round"/></marker></defs><rect x="30" y="38" width="110" height="44" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text x="85.0" y="57.0" text-anchor="middle" font-family="Helvetica" font-size="14.5" fill="#3C3489">Slow loop</text><text x="85.0" y="74.0" text-anchor="middle" font-family="Helvetica" font-size="12.5" fill="#534AB7">once a week</text><rect x="155" y="38" width="455" height="44" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><circle cx="553" cy="60" r="5" fill="#534AB7"/><rect x="30" y="128" width="110" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/><text x="85.0" y="147.0" text-anchor="middle" font-family="Helvetica" font-size="14.5" fill="#085041">Medium loop</text><text x="85.0" y="164.0" text-anchor="middle" font-family="Helvetica" font-size="12.5" fill="#0F6E56">4 per grasp</text><rect x="155" y="128" width="455" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/><circle cx="229" cy="150" r="5" fill="#0F6E56"/><circle cx="337" cy="150" r="5" fill="#0F6E56"/><circle cx="445" cy="150" r="5" fill="#0F6E56"/><circle cx="553" cy="150" r="5" fill="#0F6E56"/><rect x="30" y="218" width="110" height="44" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/><text x="85.0" y="237.0" text-anchor="middle" font-family="Helvetica" font-size="14.5" fill="#712B13">Fast loop</text><text x="85.0" y="254.0" text-anchor="middle" font-family="Helvetica" font-size="12.5" fill="#993C1D">12 per grasp</text><rect x="155" y="218" width="455" height="44" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/><circle cx="175" cy="240" r="5" fill="#993C1D"