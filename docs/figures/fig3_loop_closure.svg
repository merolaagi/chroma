<svg xmlns="http://www.w3.org/2000/svg" width="680" height="300" viewBox="0 0 680 300"><title>Walk a square and return to the start</title><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round"/></marker></defs><text x="175" y="34" text-anchor="middle" font-family="Helvetica" font-size="14" fill="#085041">Geometry computed exactly</text><rect x="115" y="70" width="120" height="120" fill="none" stroke="#0F6E56" stroke-width="1.6"/><circle cx="115" cy="190" r="6" fill="#0F6E56"/><text x="175" y="224" text-anchor="middle" font-family="Helvetica" font-size="11" fill="#0F6E56">ends exactly where it began</text><text x="175" y="242" text-anchor="middle" font-family="Helvetica" font-size="11" fill="#0F6E56">error after 32 moves: 0.0000010</text><text x="495" y="34" text-anchor="middle" font-family="Helvetica" font-size="14" fill="#791F1F">Geometry learned from data</text><path d="M435 190 L437 72 L560 76 L556 194 L462 196" fill="none" stroke="#A32D2D" stroke-width="1.6"/><circle cx="435" cy="190" r="6" fill="#A32D2D"/><circle cx="462" cy="196" r="6" fill="#A32D2D" fill-opacity="0.35"/><text x="495" y="224" text-anchor="middle" font-family="Helvetica" font-size="11" fill="#A32D2D">ends somewhere else</text><text x="495" y="242" text-anchor="middle" font-family="Helvetica" font-size="11" fill="#A32D2D">error after 32 moves: 0.65</text><line x1="340" y1="60" x2="340" y2="250" stroke="#D3D1C7" stroke-width="1"/><text x="340" y="282" text-anchor="middle" font-family="Helvetica" font-size="11" fill="#5F5E5A">Same test, measured in the code as experiment E4</text></svg>