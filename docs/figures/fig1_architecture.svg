<svg xmlns="http://www.w3.org/2000/svg" width="680" height="360" viewBox="0 0 680 360"><title>Three timescales, one currency</title><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round"/></marker></defs><rect x="170" y="30" width="340" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text x="340.0" y="55.0" text-anchor="middle" font-family="Helvetica" font-size="14.5" fill="#3C3489">Regulatory state</text><text x="340.0" y="72.0" text-anchor="middle" font-family="Helvetica" font-size="12.5" fill="#534AB7">slow dial, changes over weeks</text><line x1="340" y1="86" x2="340" y2="134" stroke="#5F5E5A" stroke-width="1.2"/><polygon points="340.0,134.0 337.0,128.0 343.0,128.0" fill="#5F5E5A"/><rect x="170" y="140" width="340" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/><text x="340.0" y="165.0" text-anchor="middle" font-family="Helvetica" font-size="14.5" fill="#085041">Lateral voting</text><text x="340.0" y="182.0" text-anchor="middle" font-family="Helvetica" font-size="12.5" fill="#0F6E56">pads compare notes, weighted by trust</text><line x1="250" y1="196" x2="175" y2="244" stroke="#5F5E5A" stroke-width="1.2"/><polygon points="175.0,244.0 178.4,238.2 181.7,243.3" fill="#5F5E5A"/><line x1="340" y1="196" x2="340" y2="244" stroke="#5F5E5A" stroke-width="1.2"/><polygon points="340.0,244.0 337.0,238.0 343.0,238.0" fill="#5F5E5A"/><line x1="430" y1="196" x2="505" y2="244" stroke="#5F5E5A" stroke-width="1.2"/><polygon points="505.0,244.0 498.3,243.3 501.6,238.2" fill="#5F5E5A"/><rect x="95" y="250" width="150" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/><text x="170.0" y="275.0" text-anchor="middle" font-family="Helvetica" font-size="14.5" fill="#712B13">Sensor pad 1</text><text x="170.0" y="292.0" text-anchor="middle" font-family="Helvetica" fo