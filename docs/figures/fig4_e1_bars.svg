<svg xmlns="http://www.w3.org/2000/svg" width="680" height="320" viewBox="0 0 680 320"><title>Experiment E1: three-arm ablation</title><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round"/></marker></defs><rect x="300" y="70" width="67.3" height="34" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/><text x="288" y="92" text-anchor="end" font-family="Helvetica" font-size="11" fill="#2C2C2A">Full system</text><text x="377.28778467908904" y="92" text-anchor="start" font-family="Helvetica" font-size="11" fill="#0F6E56">0.00271</text><rect x="300" y="140" width="62.1" height="34" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/><text x="288" y="162" text-anchor="end" font-family="Helvetica" font-size="11" fill="#2C2C2A">Slow dial, no distinct modes</text><text x="372.111801242236" y="162" text-anchor="start" font-family="Helvetica" font-size="11" fill="#0F6E56">0.00250</text><rect x="300" y="210" width="267.9" height="34" rx="4" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.8"/><text x="288" y="232" text-anchor="end" font-family="Helvetica" font-size="11" fill="#2C2C2A">No slow dial at all</text><text x="577.8571428571429" y="232" text-anchor="start" font-family="Helvetica" font-size="11" fill="#A32D2D">0.01078</text><text x="340" y="285" text-anchor="middle" font-family="Helvetica" font-size="12.5" fill="#5F5E5A">Instability of module identity (lower is better). 2 seeds.</text><text x="340" y="303" text-anchor="middle" font-family="Helvetica" font-size="12.5" fill="#5F5E5A">Rows 1 and 2 differ by 0.92x, under the 5x bar set in advance.</text></svg>