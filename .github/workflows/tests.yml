name: propositions
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: PYTHONPATH=. python tests/test_propositions.py | tee out.txt
      - run: PYTHONPATH=. python tests/test_hypercube.py | tee -a out.txt
      - run: test "$(grep -c "ALL PASS" out.txt)" = 2
